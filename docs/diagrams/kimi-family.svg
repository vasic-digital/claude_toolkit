<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960" height="640" viewBox="0 0 960 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <style>
    .node { fill:#f4f7fb; stroke:#5b7fa6; stroke-width:1.5; rx:6; ry:6; }
    .nodeh { fill:#e3edf7; stroke:#5b7fa6; stroke-width:1.5; rx:6; ry:6; }
    .cluster { fill:#fafbfc; stroke:#c5cdd6; stroke-width:1; }
    .clabel { fill:#333; font-weight:bold; }
    .label { fill:#1a1a1a; }
    .edge { stroke:#666; stroke-width:1.2; fill:none; }
    .edged { stroke:#999; stroke-width:1.2; fill:none; stroke-dasharray:4,3; }
    .etext { fill:#555; font-size:10px; }
  </style>

  <!-- Native accounts cluster -->
  <rect class="cluster" x="20" y="20" width="420" height="130" rx="8"/>
  <text class="clabel" x="30" y="40">Native accounts (isolated homes)</text>
  <rect class="node" x="35" y="50" width="390" height="40" rx="6"/>
  <text class="label" x="45" y="66">claudeN → CLAUDE_CONFIG_DIR=~/.claude-&lt;n&gt;</text>
  <text class="label" x="45" y="82">cma_run → claude (Claude Code)</text>
  <rect class="node" x="35" y="98" width="390" height="40" rx="6"/>
  <text class="label" x="45" y="114">kimiN → KIMI_CODE_HOME=~/.kimi-code-&lt;n&gt;</text>
  <text class="label" x="45" y="130">cma_run_kimi → kimi (Kimi Code CLI)</text>

  <!-- Provider engine cluster -->
  <rect class="cluster" x="520" y="20" width="420" height="150" rx="8"/>
  <text class="clabel" x="530" y="40">Provider engine (shared)</text>
  <rect class="nodeh" x="535" y="50" width="390" height="44" rx="6"/>
  <text class="label" x="545" y="67">claude-providers sync</text>
  <text class="label" x="545" y="83">verify · status.json · emit aliases</text>
  <rect class="node" x="535" y="102" width="190" height="40" rx="6"/>
  <text class="label" x="545" y="120">~/.claude-prov-&lt;id&gt;</text>
  <text class="label" x="545" y="134">(Claude Code home)</text>
  <rect class="node" x="735" y="102" width="190" height="40" rx="6"/>
  <text class="label" x="745" y="120">~/.kimi-prov-&lt;id&gt;/config.toml</text>
  <text class="label" x="745" y="134">(Kimi Code home)</text>

  <!-- Alias namespace cluster -->
  <rect class="cluster" x="20" y="180" width="420" height="120" rx="8"/>
  <text class="clabel" x="30" y="200">Alias namespace</text>
  <rect class="node" x="35" y="210" width="390" height="26" rx="6"/>
  <text class="label" x="45" y="227">&lt;id&gt;      = cma_run_provider &lt;id&gt;</text>
  <rect class="node" x="35" y="240" width="390" height="26" rx="6"/>
  <text class="label" x="45" y="257">kimi-&lt;id&gt; = cma_run_kimi_provider &lt;id&gt;</text>
  <rect class="node" x="35" y="270" width="390" height="26" rx="6"/>
  <text class="label" x="45" y="287">kc-&lt;id&gt;   = cma_run_provider kc-&lt;id&gt;</text>

  <!-- Backends cluster -->
  <rect class="cluster" x="520" y="180" width="420" height="110" rx="8"/>
  <text class="clabel" x="530" y="200">Backends</text>
  <rect class="node" x="535" y="210" width="390" height="32" rx="6"/>
  <text class="label" x="545" y="228">&lt;id&gt; provider (deepseek, …) — same backend, same key</text>
  <rect class="node" x="535" y="250" width="390" height="32" rx="6"/>
  <text class="label" x="545" y="268">Kimi native backend (kc-*)</text>

  <!-- Agents -->
  <rect class="nodeh" x="20" y="330" width="200" height="40" rx="6"/>
  <text class="label" x="30" y="355">Claude Code agent</text>
  <rect class="nodeh" x="240" y="330" width="200" height="40" rx="6"/>
  <text class="label" x="250" y="355">Kimi Code agent</text>

  <!-- Edges -->
  <line class="edge" x1="230" y1="60" x2="310" y2="330" marker-end="url(#arr)"/>
  <text class="etext" x="250" y="180">native</text>
  <line class="edge" x1="230" y1="118" x2="340" y2="330" marker-end="url(#arr)"/>
  <text class="etext" x="265" y="220">native</text>

  <line class="edge" x1="440" y1="223" x2="120" y2="330" marker-end="url(#arr)"/>
  <text class="etext" x="250" y="315">&lt;id&gt;</text>
  <line class="edge" x1="440" y1="253" x2="340" y2="330" marker-end="url(#arr)"/>
  <text class="etext" x="380" y="300">kimi-&lt;id&gt; (shared status.json)</text>
  <line class="edge" x1="440" y1="283" x2="120" y2="330" marker-end="url(#arr)"/>
  <text class="etext" x="250" y="396">kc-&lt;id&gt;</text>

  <!-- Agents to backends -->
  <line class="edge" x1="120" y1="370" x2="560" y2="242" marker-end="url(#arr)"/>
  <text class="etext" x="300" y="420">Claude Code → backend &lt;id&gt;</text>
  <line class="edged" x1="340" y1="370" x2="760" y2="242" marker-end="url(#arrd)"/>
  <text class="etext" x="520" y="410">Kimi Code → backend &lt;id&gt;</text>
  <line class="edge" x1="120" y1="370" x2="900" y2="290" marker-end="url(#arr)"/>
  <text class="etext" x="640" y="430">Claude Code → Kimi native (kc-*)</text>

  <!-- Legend -->
  <rect class="node" x="520" y="440" width="420" height="170" rx="8"/>
  <text class="label" x="530" y="460">Namespace contract (one line)</text>
  <text class="label" x="530" y="482">claudeN  → Claude Code, native account N</text>
  <text class="label" x="530" y="504">kimiN    → Kimi Code, native account N</text>
  <text class="label" x="530" y="526">&lt;id&gt;     → Claude Code on backend &lt;id&gt; (no prefix — always Claude)</text>
  <text class="label" x="530" y="548">kimi-&lt;id&gt; → Kimi Code on backend &lt;id&gt; (kimi- prefix — always Kimi)</text>
  <text class="label" x="530" y="570">kc-&lt;id&gt;   → Claude Code on a Kimi-native backend (legacy renamed)</text>
  <text class="label" x="530" y="592">kimiN never named kimi-*/kc-*; kc-* get no kimi flavor</text>

  <text class="etext" x="30" y="440">Source: docs/diagrams/kimi-family.mmd (rendered — display without a renderer)</text>
</svg>
